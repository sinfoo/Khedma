I/CD practices, and engineering standards. •   Identify and resolve performance, reliability, and scalability issues across services, APIs, and data-processing workloads. •   Participate in system design discussions and collaborate with cross-functional teams to deliver secure, high-quality solutions. •   Partner with Product, Engineering, Data Governance, Security, and business stakeholders to understand requirements and deliver against shared goals. •   Work effectively with teams across global time zones and continue to grow your skills as the platform and team responsibilities evolve. <br>All About You:<br>•   Bachelor's or Master's degree in Computer Science, Engineering, or a related technical field, or equivalent practical experience. •   Strong software engineering fundamentals, including object-oriented programming, API design, testing, and scalable system design. •   Backend development experience with Java preferred; strong Python experience will also be considered. •   Hands-on experience with Apache Spark for building or optimizing data-processing workloads. •   Experience with cloud and cloud-native technologies, with AWS and Databricks experience strongly preferred. •   Working knowledge of CI/CD pipelines, version control, automated testing, and production support. •   Experience building or contributing to data-centric platforms, distributed systems, or enterprise data integration solutions. •   Strong problem-solving, collaboration, and communication skills, with the ability to work effectively in an agile environment. •   Curiosity, ownership, and a growth mindset, with the ability to adapt as priorities and responsibilities take shape. <br>Preferred Experience:<br>•   Experience with Spring Boot. •   Front-end development exposure, including React or Angular. •   Experience with streaming technologies such as Kafka and Flink. •   Experience building reusable platforms that serve multiple products, teams, or business domains. •   Exposure to integrating AI-driven capabilities into data platforms with appropriate governance and guardrails.<br>Mastercard is a merit-based, inclusive, equal opportunity employer that considers applicants without regard to gender, gender identity, sexual orientation, race, ethnicity, disabled or veteran status, or any other characteristic protected by law. We hire the most qualified candidate for the role. In the US or Canada, if you require accommodations or assistance to complete the online application process or during the recruitment process, please contact reasonable_accommodation@mastercard.com and identify the type of accommodation or assistance you are requesting. Do not include any medical or health information in this email. The Reasonable Accommodations team will respond to your email promptly.<br><b>Corporate Security Responsibility</b><br>All activities involving access to Mastercard assets, information, and networks comes with an inherent risk to the organization and, therefore, it is expected that every person working for, or on behalf of, Mastercard is responsible for information security and must:<br><ul><li>Abide by Mastercard's security policies and practices;</li><li>Ensure the confidentiality and integrity of the information being accessed;</li><li>Report any suspected information security violation or breach, and</li><li>Complete all periodic mandatory security trainings in accordance with Mastercard's guidelines.</li></ul><br>In line with Mastercard's total compensation philosophy and assuming that the job will be performed in the US, the successful candidate will be offered a competitive base salary and may be eligible for an annual bonus or commissions depending on the role. The base salary offered may vary depending on multiple factors, including but not limited to location, job-related knowledge, skills, and experience. Mastercard benefits for full time (and certain part time) employees generally include: insurance (including medical, prescription drug,
